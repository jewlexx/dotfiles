[bootstrap.brew.taps]
"homeport/tap" = "https://github.com/homeport/homebrew-tap.git"
"jewlexx/tap" = "https://github.com/jewlexx/homebrew-tap.git"
"nohajc/anylinuxfs" = "https://github.com/nohajc/homebrew-anylinuxfs.git"

[tools]
"aqua:itchio/butler" = "latest"
black = "latest"
cargo-msrv = "latest"
"cargo:cargo-binstall" = "latest"
"cargo:cargo-binutils" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-expand" = "latest"
"cargo:cargo-update" = "latest"
"github:jdx/aube" = "latest"
java = "latest"
node = "latest"
"npm:avocado" = "latest"
ruby = "latest"
ruff = "latest"

[settings]
cargo.binstall = true
cargo.binstall_quickinstall = true
dotfiles.root = "~/.dotfiles"
idiomatic_version_file_enable_tools = ["node", "rust"]
java.shorthand_vendor = "temurin"
