[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

# Reference: https://alacritty.org/config-alacritty.html

[font.normal]
# family = "Delugia Mono"
family = "Jetbrains Mono Nerd Font"
style = "Bold"

[font]
size = 12.0

[[keyboard.bindings]]
action = "Quit"
key = "W"
mods = "Control|Shift"

# [[keyboard.bindings]]
# action = "ToggleFullscreen"
# key = "F11"

[terminal]
shell = "/usr/bin/fish"

[window]
dimensions = { columns = 120, lines = 30 }
dynamic_title = true
opacity = 0.8
blur = true
